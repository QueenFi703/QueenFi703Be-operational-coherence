name: 'Summary Generate'
description: 'Creates human-readable execution summary'

inputs:
  phase:
    description: 'Which phase is reporting'
    required: true
  metrics:
    description: 'JSON of collected metrics'
    required: false
  status:
    description: 'success, warning, failure'
    required: true
  additional-info:
    description: 'Additional information to include'
    required: false

outputs:
  summary-file:
    description: 'Path to summary file'
    value: ${{ steps.generate.outputs.file }}

runs:
  using: 'composite'
  steps:
    - name: Generate markdown summary
      id: generate
      shell: bash
      run: |
        mkdir -p .metrics
        
        SUMMARY_FILE=".metrics/summary-${{ inputs.phase }}.md"
        
        # Determine status emoji
        case "${{ inputs.status }}" in
          success)
            STATUS_EMOJI="✅"
            ;;
          warning)
            STATUS_EMOJI="⚠️"
            ;;
          failure)
            STATUS_EMOJI="❌"
            ;;
          *)
            STATUS_EMOJI="ℹ️"
            ;;
        esac
        
        # Generate summary
        cat > "$SUMMARY_FILE" << EOF
        ## $STATUS_EMOJI Phase: ${{ inputs.phase }}
        
        **Status:** ${{ inputs.status }}
        **Timestamp:** $(date -Iseconds)
        **Phase:** ${{ inputs.phase }}
        
        EOF
        
        # Add metrics if provided
        if [[ -n "${{ inputs.metrics }}" ]]; then
          cat >> "$SUMMARY_FILE" << EOF
        ### 📊 Metrics
        
        \`\`\`json
        ${{ inputs.metrics }}
        \`\`\`
        
        EOF
        fi
        
        # Add additional info if provided
        if [[ -n "${{ inputs.additional-info }}" ]]; then
          cat >> "$SUMMARY_FILE" << EOF
        ### 📝 Additional Information
        
        ${{ inputs.additional-info }}
        
        EOF
        fi
        
        echo "file=$SUMMARY_FILE" >> $GITHUB_OUTPUT
        
        # Append to GitHub step summary
        cat "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
        
        echo "Summary generated for phase: ${{ inputs.phase }}"
        
    - name: Upload summary artifact
      uses: actions/upload-artifact@v4
      with:
        name: summary-${{ inputs.phase }}
        path: .metrics/summary-${{ inputs.phase }}.md
        retention-days: 30
